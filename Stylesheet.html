<style>
  :root {
    --fg: #202124;
    --muted: #5f6368;
    --line: #dadce0;
    --accent: #1a73e8;
    --warn: #d93025;
    --ok: #188038;
    --bg-soft: #f1f3f4;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Roboto, 'Noto Sans JP', sans-serif;
    font-size: 13px;
    color: var(--fg);
    margin: 0;
    padding: 8px 10px 24px;
  }
  h2 {
    font-size: 13px;
    font-weight: 600;
    margin: 14px 0 6px;
    padding-bottom: 4px;
    border-bottom: 1px solid var(--line);
  }
  h2:first-child { margin-top: 2px; }
  .muted { color: var(--muted); }
  .small { font-size: 11px; }
  .row { display: flex; align-items: center; gap: 6px; }
  .grow { flex: 1; }

  input[type="text"], input[type="search"] {
    width: 100%;
    padding: 6px 8px;
    border: 1px solid var(--line);
    border-radius: 4px;
    font-size: 13px;
  }
  button {
    font-size: 12px;
    padding: 5px 10px;
    border: 1px solid var(--line);
    background: #fff;
    border-radius: 4px;
    cursor: pointer;
  }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.primary:hover { background: #1765cc; }
  button:hover { background: var(--bg-soft); }
  button:disabled { opacity: .5; cursor: default; }

  .breadcrumb { font-size: 11px; color: var(--muted); margin: 4px 0; word-break: break-all; }
  .crumb-link { color: var(--accent); cursor: pointer; text-decoration: underline; }

  ul.list { list-style: none; margin: 6px 0; padding: 0; max-height: 220px; overflow-y: auto; }
  ul.list li {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 4px; border-bottom: 1px solid #eee;
  }
  .icon { width: 16px; text-align: center; }
  .name { flex: 1; word-break: break-all; cursor: default; }
  .name.clickable { cursor: pointer; color: var(--accent); }

  .badge {
    font-size: 10px; padding: 1px 5px; border-radius: 8px; white-space: nowrap;
    border: 1px solid var(--line);
  }
  .badge.manual { background: #e8f0fe; color: #1967d2; border-color: #d2e3fc; }
  .badge.external { background: #fef7e0; color: #b06000; border-color: #feefc3; }
  .badge.ok { color: var(--ok); border-color: #ceead6; background: #e6f4ea; }
  .badge.path_updated, .badge.id_relinked { color: #b06000; background: #fef7e0; border-color: #feefc3; }
  .badge.broken { color: var(--warn); background: #fce8e6; border-color: #f6cbc7; }

  .status-line { margin: 6px 0; font-size: 12px; }
  .status-line.ok { color: var(--ok); }
  .status-line.err { color: var(--warn); }
  .spinner { display: none; font-size: 11px; color: var(--muted); }
  .spinner.on { display: inline; }

  .check-row { display: flex; align-items: center; gap: 6px; padding: 3px 2px; }
  .empty { color: var(--muted); font-size: 12px; padding: 4px 0; }
</style>
